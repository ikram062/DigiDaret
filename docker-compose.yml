services:
  digidaret-db:
    image: postgres:16
    container_name: digidaret-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: digidaret
    ports:
      - "5432:5432"
    volumes:
      - digidaret-db-data:/var/lib/postgresql/data

volumes:
  digidaret-db-data: